<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @page {
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1584px;
        height: 396px;
        overflow: hidden;
        background: #07070e;
      }

      .banner {
        position: relative;
        width: 1584px;
        height: 396px;
        overflow: hidden;
        background:
          radial-gradient(620px 460px at 16% 4%, rgba(126, 90, 255, 0.5), transparent 64%),
          radial-gradient(560px 420px at 88% 96%, rgba(34, 211, 238, 0.34), transparent 66%),
          radial-gradient(420px 320px at 62% 0%, rgba(255, 96, 200, 0.16), transparent 62%),
          #07070e;
      }

      /* faint straight grid in the sky */
      .sky-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(ellipse 80% 90% at 40% 30%, #000 10%, transparent 75%);
        mask-image: radial-gradient(ellipse 80% 90% at 40% 30%, #000 10%, transparent 75%);
      }

      /* synthwave floor: a plane of lines receding to a horizon */
      .floor {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -74px;
        height: 280px;
        background-image:
          repeating-linear-gradient(
            to right,
            rgba(167, 139, 250, 0.55) 0 2px,
            transparent 2px 92px
          ),
          repeating-linear-gradient(
            to bottom,
            rgba(34, 211, 238, 0.45) 0 2px,
            transparent 2px 58px
          );
        transform: perspective(430px) rotateX(70deg);
        transform-origin: bottom center;
        -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0, 0, 0, 0.65) 42%, transparent 92%);
        mask-image: linear-gradient(to top, #000 0%, rgba(0, 0, 0, 0.65) 42%, transparent 92%);
        opacity: 0.9;
      }

      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 168px;
        height: 2px;
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(167, 139, 250, 0.55) 22%,
          rgba(34, 211, 238, 0.75) 58%,
          transparent 92%
        );
        filter: blur(0.6px);
      }

      /* text block, kept clear of the profile photo in the bottom-left */
      .copy {
        position: absolute;
        right: 210px;
        top: 92px;
        text-align: right;
        font-family: "Outfit", system-ui, sans-serif;
      }

      .eyebrow {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #c4b5fd;
        opacity: 0.92;
      }

      .line {
        margin-top: 18px;
        font-size: 37px;
        font-weight: 700;
        letter-spacing: -0.6px;
        line-height: 1.18;
        background: linear-gradient(96deg, #ede9fe 0%, #a78bfa 46%, #22d3ee 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .url {
        margin-top: 22px;
        font-size: 17px;
        letter-spacing: 1.2px;
        color: rgba(196, 181, 253, 0.66);
      }

      /* oversized ghost monogram, echoing the avatar */
      .ghost {
        position: absolute;
        left: 46px;
        top: -104px;
        font-family: "Fredoka", system-ui, sans-serif;
        font-weight: 600;
        font-size: 470px;
        line-height: 1;
        color: transparent;
        background: linear-gradient(150deg, rgba(167, 139, 250, 0.28), rgba(34, 211, 238, 0.1));
        -webkit-background-clip: text;
        background-clip: text;
      }

      .sparkle {
        position: absolute;
        background: #f5b8ff;
        clip-path: polygon(
          50% 0%,
          61% 39%,
          100% 50%,
          61% 61%,
          50% 100%,
          39% 61%,
          0% 50%,
          39% 39%
        );
      }

      .s1 {
        top: 52px;
        right: 300px;
        width: 30px;
        height: 30px;
        filter: drop-shadow(0 0 18px rgba(245, 184, 255, 0.9));
      }

      .s2 {
        top: 118px;
        right: 236px;
        width: 15px;
        height: 15px;
        opacity: 0.7;
      }

      .s3 {
        top: 210px;
        left: 560px;
        width: 12px;
        height: 12px;
        opacity: 0.45;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(4, 4, 10, 0.62) 100%);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="sky-grid"></div>
      <div class="ghost">A</div>
      <div class="floor"></div>
      <div class="horizon"></div>
      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
      <div class="copy">
        <p class="eyebrow">Full-stack engineer · AI systems</p>
        <p class="line">Retrieval, agents,<br />and the SaaS around them.</p>
        <p class="url">mrfox2000.github.io/portfolio-site</p>
      </div>
      <div class="vignette"></div>
    </div>
  </body>
</html>
